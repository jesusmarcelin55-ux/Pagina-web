<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Frontend Sencillo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Pantalla de Login -->
  <div id="login">
    <h1>Bienvenido</h1>
    <input type="text" id="usuario" placeholder="Usuario"><br>
    <input type="password" id="password" placeholder="Contraseña"><br>
    <button onclick="login()">Ingresar</button>
  </div>

  <!-- Dashboard protegido -->
  <div id="dashboard" style="display:none;">
    <header>
      <h2>Panel de Administración</h2>
      <p>Bienvenido, <span id="nombreUsuario"></span></p>
      <button onclick="logout()">Cerrar Sesión</button>
    </header>
    <section class="cards">
      <div class="card">Usuarios Activos: 128</div>
      <div class="card">Servicios Online: 12</div>
      <div class="card">Ventas Hoy: $1540</div>
      <div class="card">Alertas de Seguridad: 3</div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
